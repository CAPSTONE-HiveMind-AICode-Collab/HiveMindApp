services:
  hivemind:
    build:
      context: .
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
        - NEXT_PUBLIC_MASTER_HIVE_KEY=${NEXT_PUBLIC_MASTER_HIVE_KEY}
    container_name: hivemind-instance
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: always
    # Runtime Limits for Application Layer
    deploy:
      resources:
        limits:
          cpus: '0.75'      # Max 75% of one CPU core
          memory: 1024M    # Max 1GB RAM
        reservations:
          memory: 512M     # Minimum 512MB RAM

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: hivemind-monitor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # Runtime Limits for Monitoring Agent
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
        reservations:
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    container_name: hivemind-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    # Runtime Limits for Data Processing
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: hivemind-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    # Runtime Limits for Visualization
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 512M
        reservations:
          memory: 256M